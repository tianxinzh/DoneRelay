services:
  donerelay:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_PATH: /data/donerelay.sqlite
      PORT: 8787
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - donerelay-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  donerelay-data:
