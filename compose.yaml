services:
  relay:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DONERELAY_HOST: 0.0.0.0
      DONERELAY_DATA_DIR: /data
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - relay-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  relay-data:
