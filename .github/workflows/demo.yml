name: Render README demo
on:
  push:
    branches: [main]
    paths:
      - scripts/render-checkout-demo.py
      - .github/workflows/demo.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: readme-demo
  cancel-in-progress: false
jobs:
  render:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering tools
        run: |
          python -m pip install Pillow==11.3.0
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-inter fonts-dejavu-core
      - name: Render approved illustration
        run: python scripts/render-checkout-demo.py --output-dir /tmp/donerelay-demo
      - name: Commit GIF and reduced-motion poster
        run: |
          git pull --ff-only origin main
          mkdir -p docs/assets
          cp /tmp/donerelay-demo/donerelay-checkout-demo.gif docs/assets/
          cp /tmp/donerelay-demo/donerelay-checkout-demo-poster.png docs/assets/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/donerelay-checkout-demo.gif docs/assets/donerelay-checkout-demo-poster.png
          if ! git diff --cached --quiet; then
            git commit -m 'docs: publish illustrated checkout GIF and poster'
            git push origin HEAD:main
          fi
